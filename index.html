<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akuya</title>
<meta name="description" content="Akuya 的个人主页 — 全网 AI 源头">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #ffffff;
    color: #111111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 9vh 8vw 6vh;
    -webkit-font-smoothing: antialiased;
  }
  main { flex: 1; max-width: 720px; }
  h1 {
    font-size: clamp(2.6rem, 8vw, 4.5rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .sub {
    margin-top: 2.5rem;
    font-size: 1.1rem;
    line-height: 1.8;
    color: #555555;
  }
  .shop { margin-top: 4.5rem; }
  .shop h2 {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #999999;
    text-transform: uppercase;
  }
  .shop .tagline {
    margin-top: 1rem;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    line-height: 1.3;
  }
  .shop .desc {
    margin-top: 1rem;
    font-size: 1.05rem;
    line-height: 1.8;
    color: #555555;
  }
  .shop a {
    margin-top: 1.8rem;
    font-size: 1.25rem;
    color: #111111;
    text-decoration: none;
    border-bottom: 1px solid #e5e5e5;
    padding-bottom: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.2s, border-color 0.2s;
  }
  .shop a:hover { color: #666666; border-color: #111111; }
  .shop a span { font-size: 0.95rem; color: #999999; }
  footer {
    margin-top: 4rem;
    font-size: 0.85rem;
    color: #aaaaaa;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <main>
    <h1>你好，<br>我是 Akuya。</h1>
    <p class="sub">欢迎来到我的小站。</p>
    <section class="shop">
      <h2>我的店铺</h2>
      <p class="tagline">全网 AI 源头</p>
      <p class="desc">全网 AI 好货的源头，一手货源，价格实在。<br>需要什么，进店看看。</p>
      <a href="https://wzyp.cn/shop/akuya">进入店铺 <span>wzyp.cn/shop/akuya ↗</span></a>
    </section>
  </main>
  <footer>akuya.loc.cc</footer>
</body>
</html>
