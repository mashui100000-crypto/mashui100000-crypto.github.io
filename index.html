<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akuya</title>
<meta name="description" content="Akuya 的个人主页">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #ffffff;
    color: #111111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 9vh 8vw 6vh;
    -webkit-font-smoothing: antialiased;
  }
  main { flex: 1; max-width: 720px; }
  h1 {
    font-size: clamp(2.6rem, 8vw, 4.5rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .sub {
    margin-top: 2.5rem;
    font-size: 1.1rem;
    line-height: 1.8;
    color: #555555;
  }
  nav {
    margin-top: 4rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  nav a {
    font-size: 1.25rem;
    color: #111111;
    text-decoration: none;
    border-bottom: 1px solid #e5e5e5;
    padding-bottom: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.2s, border-color 0.2s;
  }
  nav a:hover { color: #666666; border-color: #111111; }
  nav a span { font-size: 0.95rem; color: #999999; }
  footer {
    margin-top: 4rem;
    font-size: 0.85rem;
    color: #aaaaaa;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <main>
    <h1>你好，<br>我是 Akuya。</h1>
    <p class="sub">欢迎来到我的小站。<br>逛逛我的店铺，或者到别处找我。</p>
    <nav>
      <a href="https://wzyp.cn/shop/akuya">我的店铺 <span>wzyp.cn/shop/akuya ↗</span></a>
      <a href="https://github.com/mashui100000-crypto">GitHub <span>mashui100000-crypto ↗</span></a>
    </nav>
  </main>
  <footer>akuya.loc.cc</footer>
</body>
</html>
